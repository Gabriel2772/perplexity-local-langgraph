[project]
name = "perplexity-local-langgraph"
version = "0.1.0"
description = "Pesquisa na web com LangGraph, Ollama, Tavily e Streamlit"
authors = [{name = "Gabriel Amaral"}]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "streamlit>=1.63.0,<2.0.0",
    "langgraph>=1.2.11,<2.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "pydantic>=2.0,<3.0",
    "tavily-python>=0.7,<1.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
ruff = ">=0.12,<1"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
